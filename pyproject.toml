[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-atlas"
version = "0.1.0"
description = "A compact camera-conditioned RGBD world-model experiment"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "Pillow>=9", "plyfile>=1", "torch>=2.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["open_atlas*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
